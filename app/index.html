<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitLog | 운동 기록</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>

<body>
  <main>
    <header class="page-header">
      <div>
        <p class="brand">FITLOG</p>
        <h1>오늘의 운동 기록</h1>
        <p class="muted">운동을 선택하고, 수행한 세트를 하나씩 기록하세요.</p>
      </div>
      <span class="badge">나만의 운동 노트</span>
    </header>

    <form id="workout-form">
      <fieldset id="form-fields">
        <legend class="sr-only">운동 기록 입력</legend>
        <label class="date-label">완료 시각 (한국 시간)
          <input id="completed-at" type="datetime-local" required>
        </label>
        <div class="catalog-toolbar">
          <p id="catalog-status" class="muted" role="status"></p>
          <button id="reload-exercises" class="text-button" type="button">종목 목록 새로고침</button>
        </div>
        <p id="edit-banner" class="edit-banner" role="status" hidden></p>
        <div id="exercise-cards"></div>
        <div class="form-actions">
          <button id="add-exercise" class="secondary" type="button">+ 다른 운동 추가</button>
          <div class="record-actions">
            <button id="cancel-edit" class="secondary" type="button" hidden>수정 취소</button>
            <button id="save-workout" type="submit">운동 기록 저장</button>
          </div>
        </div>
      </fieldset>
      <p id="form-status" role="status" aria-live="polite"></p>
    </form>

    <section class="category-section" aria-labelledby="category-title">
      <h2 id="category-title">운동 부위 설정</h2>
      <p class="muted">기존 종목의 부위를 지정하면 같은 부위 운동 기록을 묶어 볼 수 있습니다.</p>

      <label for="category-exercise">운동 종목</label>
      <select id="category-exercise">
        <option value="">종목을 선택하세요</option>
      </select>

      <label for="category-part">운동 부위</label>
      <select id="category-part">
        <option value="가슴">가슴</option>
        <option value="등">등</option>
        <option value="하체">하체</option>
        <option value="어깨">어깨</option>
        <option value="팔">팔</option>
        <option value="코어">코어</option>
        <option value="유산소">유산소</option>
        <option value="전신">전신</option>
        <option value="미분류">미분류</option>
      </select>

      <button id="save-category" type="button">부위 저장</button>
      <p id="category-status" role="status" aria-live="polite"></p>
    </section>

    <section class="history-section" aria-labelledby="history-title">
      <div class="section-heading">
        <h2 id="history-title">최근 운동 기록</h2>
        <button id="refresh" class="secondary" type="button">기록 새로고침</button>
      </div>
      <p id="action-status" role="status" aria-live="polite"></p>
      <p id="status" role="status"></p>
      <div id="workouts"></div>
    </section>

    <section class="insights-section" aria-labelledby="insights-title">
      <h2 id="insights-title">종목별 운동 기록</h2>
      <p class="muted">선택한 종목과 같은 부위의 최근 7회 운동을 확인하세요.</p>

      <label for="insight-exercise">조회할 운동 종목</label>
      <select id="insight-exercise">
        <option value="">종목을 선택하세요</option>
      </select>

      <p id="insight-status" role="status" aria-live="polite"></p>

      <h3>선택 종목의 최근 7회</h3>
      <div id="recent-exercise"></div>

      <h3>같은 부위의 최근 7회</h3>
      <div id="recent-body-part"></div>
      <h3>종목별 최고 중량 변화</h3>
      <div id="progress-chart" class="progress-chart"></div>
    </section>

    <section class="suggestion-section" aria-labelledby="suggestion-title">
      <h2 id="suggestion-title">오늘 운동 제안</h2>
      <p>저장된 기록을 바탕으로 오늘의 종목과 세트를 제안받습니다.</p>
      <label for="ai-token">AI 기능 접근 토큰</label>
      <input id="ai-token" type="password" autocomplete="off">
      <button id="suggest-workout" type="button">오늘 운동 제안받기</button>
      <p id="suggestion-status" role="status"></p>
      <div id="suggestion-result"></div>
    </section>

  </main>
</body>

</html>
